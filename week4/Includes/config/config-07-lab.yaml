# ============================================================
# Course Setup Configuration
# ============================================================
# All sections marked OPTIONAL can be removed entirely to skip
# that step. Steps are silent when not configured.
# ============================================================

# Set to true for development (enables manifest validation + cleanup)
dev_mode: false

# Set to true to drop the catalog after setup (requires dev_mode: true)
resource_cleanup: false

# Set to true if this course uses the Medallion Lab pattern
medallion_lab: false

# Course name — must match the 'course' field in manifest.yaml
course_name: "Deploying and Monitoring Agents on Databricks"

# Serverless compute version check (remove to skip check)
serverless_compute_version: "6"

# ---- Catalog and Schema (REQUIRED) ----
catalog:
  name: "workspace"   # this repo: use the existing default catalog (course default: null = auto-create labuser_<user>)
  prefix: "labuser"   # Prefix used when auto-creating a catalog outside Vocareum
  schema_name: "agent_monitoring"
  volume_name: null   # OPTIONAL — remove or set null to skip volume creation

# ---- MLflow Setup (OPTIONAL) ----
# Standalone MLflow configuration — sets tracking URI and creates an experiment.
# Use this when you need MLflow configured (e.g., for tracing or evaluation)
# without going through full agent registration.
# Remove this section to skip standalone MLflow setup.
# NOTE: Agent setup (below) also configures MLflow automatically when enabled.
mlflow:
  tracking_uri: "databricks"       # default; only change for custom tracking servers
  experiment_name: "backfill-training"  # created under /Workspace/Users/{username}/
  trace_location:
    table_prefix: "backfill_traces"  # stores traces in {catalog}.{schema}.backfill_traces_otel_* UC tables

# ---- Synthetic Traces (OPTIONAL) ----
# Generate pre-built conversation traces without making LLM calls.
# Requires mlflow section above to be configured (needs an active experiment).
# Set enabled: false or remove this section to skip trace generation.
synthetic_traces:
  enabled: true
  app_version: "2.1.0"   # attached as a span attribute on each trace
  message_only_inputs: true  # each trace's input is only the user's message

# ---- SQL warehouse (OPTIONAL) ----
# Looked up by name. set_tracing_env exports MLFLOW_TRACING_SQL_WAREHOUSE_ID,
# which MLflow needs to write and search traces stored in Unity Catalog.
sql_warehouse:
  name: "2x Small Serverless Warehouse"   # this repo: an existing serverless warehouse (Academy labs: "shared_warehouse")
  set_tracing_env: true

# Unity Gateway model service the judges call (created by Workspace-Setup)
judge_model: "databricks:/workspace.agent_deployment.judge-model"

# ---- Production monitoring judges (OPTIONAL) ----
# Registers and starts built-in MLflow judges on the experiment above.
# Needs the mlflow section. With the sql_warehouse section, setup also saves
# that warehouse on the experiment for the monitoring job (UC-backed traces).
#   judge:         any built-in judge in mlflow.genai.scorers, e.g. Safety,
#                  ConversationCompleteness, UserFrustration, Guidelines
#   name:          registered name, unique in the experiment (default: snake_case of judge)
#   sample_rate:   0.0-1.0 (0 registers the judge without starting it)
#   filter_string: optional search_traces filter for which traces to score
#   model:         optional; defaults to judge_model above
#   args:          optional constructor args, e.g. {guidelines: ["..."]} for Guidelines
monitoring:
  judges:
    - judge: ConversationCompleteness
      name: conversation_completeness
      sample_rate: 0.7

# Library groups from Includes/dependencies.toml
libraries:
  groups:
    - pyyaml
    - databricks-sdk
    - databricks-openai
    - databricks-agents
    - mlflow
