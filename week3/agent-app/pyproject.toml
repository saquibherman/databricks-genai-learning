[project]
name = "agent-server"
version = "0.1.0"
description = "Serves the course's Unity Catalog-registered agent with MLflow AgentServer"
requires-python = ">=3.11"
# The app loads the registered agent model, which imports mlflow,
# databricks-openai, databricks-mcp, and nest_asyncio. Keep those at the versions
# the model was logged with (Includes/shared_agent/requirements.txt).
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "mlflow==3.16.1",
    "databricks-openai==0.17.1",
    "databricks-mcp==0.9.2",
    "databricks-sdk==0.145.0",
    "nest_asyncio==1.6.0",
    "pyyaml==6.0.3",
    "python-dotenv>=1.2.1",
    # mlflow downloads UC model artifacts from S3 with boto3. Notebook runtimes
    # include it, but the app's environment doesn't.
    "boto3==1.43.118",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
start-server = "agent_server.start_server:main"
