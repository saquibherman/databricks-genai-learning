# Package catalog for Agent Evaluation on Databricks.
# Lessons install groups from this file through Includes/config/config-*.yaml.
# The agents' own model environments (shared_agent/requirements.txt and
# agents/requirements.txt) use the same versions; keep them in sync.

[pyyaml]
pyyaml = "6.0.3"

[databricks-sdk]
databricks-sdk = "0.145.0"

[databricks-mcp]
databricks-mcp = "0.9.2"

[nest-asyncio]
nest_asyncio = "1.6.0"

[databricks-openai]
databricks-openai = "0.17.1"

[databricks-agents]
databricks-agents = "1.12.0"

[mlflow]
mlflow = "3.16.1"
